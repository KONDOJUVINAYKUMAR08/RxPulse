apiVersion: v1
kind: Service
metadata:
  name: mongo-user
  namespace: rxpulse-dev
  labels:
    app: mongo-user
    app.kubernetes.io/part-of: rxpulse
    app.kubernetes.io/managed-by: kubectl
    environment: dev
spec:
  clusterIP: None
  selector:
    app: mongo-user
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      protocol: TCP
