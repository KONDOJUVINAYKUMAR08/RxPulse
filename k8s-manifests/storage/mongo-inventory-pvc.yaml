apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-inventory-pvc
  namespace: rxpulse-dev
  labels:
    app: mongo-inventory
    app.kubernetes.io/part-of: rxpulse
    app.kubernetes.io/managed-by: kubectl
    environment: dev
spec:
  storageClassName: nfs-client
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
