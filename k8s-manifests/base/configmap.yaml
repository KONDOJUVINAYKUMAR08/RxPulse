apiVersion: v1
kind: ConfigMap
metadata:
  name: rxpulse-config
  namespace: rxpulse-dev
  labels:
    app.kubernetes.io/part-of: rxpulse
    app.kubernetes.io/managed-by: kubectl
    environment: dev
data:
  NODE_ENV: "development"

  USER_SERVICE_PORT: "3001"
  USER_MONGO_HOST: "mongo-user"
  USER_MONGO_PORT: "27017"
  USER_MONGO_DB: "userdb"

  CATALOG_SERVICE_PORT: "3002"
  CATALOG_MONGO_HOST: "mongo-catalog"
  CATALOG_MONGO_PORT: "27017"
  CATALOG_MONGO_DB: "catalogdb"

  INVENTORY_SERVICE_PORT: "3003"
  INVENTORY_MONGO_HOST: "mongo-inventory"
  INVENTORY_MONGO_PORT: "27017"
  INVENTORY_MONGO_DB: "inventorydb"

  FRONTEND_PORT: "8080"
  VITE_USER_SERVICE_URL: "http://user-service:3001"
  VITE_CATALOG_SERVICE_URL: "http://catalog-service:3002"
  VITE_INVENTORY_SERVICE_URL: "http://inventory-service:3003"
