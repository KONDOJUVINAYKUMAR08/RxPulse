apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rxpulse-gateway
  namespace: rxpulse-dev
  labels:
    app.kubernetes.io/part-of: rxpulse
    app.kubernetes.io/managed-by: kubectl
    environment: dev
spec:
  gatewayClassName: kgateway

  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
