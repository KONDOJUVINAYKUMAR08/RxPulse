version: '3.8'

services:
  mongo-user:
    image: mongo:6.0
    container_name: mongo-user
    restart: always
    ports:
      - "27020:27017"
    volumes:
      - mongo-user-data:/data/db
    networks:
      - rxpulse-network

  mongo-catalog:
    image: mongo:6.0
    container_name: mongo-catalog
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-catalog-data:/data/db
    networks:
      - rxpulse-network

  mongo-inventory:
    image: mongo:6.0
    container_name: mongo-inventory
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - mongo-inventory-data:/data/db
    networks:
      - rxpulse-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./services/user-service/.env
    depends_on:
      - mongo-user
    networks:
      - rxpulse-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - ./services/catalog-service/.env
    depends_on:
      - mongo-catalog
    networks:
      - rxpulse-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    restart: always
    ports:
      - "3003:3003"
    env_file:
      - ./services/inventory-service/.env
    depends_on:
      - mongo-inventory
    networks:
      - rxpulse-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - user-service
      - catalog-service
      - inventory-service
    networks:
      - rxpulse-network

networks:
  rxpulse-network:
    driver: bridge

volumes:
  mongo-user-data:
  mongo-catalog-data:
  mongo-inventory-data:
