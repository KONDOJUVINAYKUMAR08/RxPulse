apiVersion: v1
kind: ConfigMap
metadata:
  name: rxpulse-config
  namespace: rxpulse
data:
  NODE_ENV: "production"
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  USER_SERVICE_PORT: "3001"
  CATALOG_SERVICE_PORT: "3002"
  INVENTORY_SERVICE_PORT: "3003"
  USER_SERVICE_URL: "http://user-service:3001"
  CATALOG_SERVICE_URL: "http://catalog-service:3002"
  INVENTORY_SERVICE_URL: "http://inventory-service:3003"
