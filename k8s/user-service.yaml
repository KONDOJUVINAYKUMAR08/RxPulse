apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: rxpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: rxpulsehub/rxpulse-user:v0.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: rxpulse-config
                  key: USER_SERVICE_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: rxpulse-config
                  key: NODE_ENV
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: rxpulse-secrets
                  key: MONGO_USER_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rxpulse-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: rxpulse
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
