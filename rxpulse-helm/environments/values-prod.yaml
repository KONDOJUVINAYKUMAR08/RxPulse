
global:
  namespace: rxpulse-prod
  environment: prod
catalog:
  replicaCount: 2
  image:
    tag: stable
  seedJob:
    enabled: false   # Seed only once manually in prod
inventory:
  replicaCount: 2
  image:
    tag: stable
  seedJob:
    enabled: false
user:
  replicaCount: 2
  image:
    tag: stable
frontend:
  replicaCount: 3
  image:
    tag: stable
  blueGreen:
    autoPromotionEnabled: false   # Always manual promotion in prod
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
rbac:
  namespace: rxpulse-prod
  configMap:
    nodeEnv: production
sealed-secrets:
  secret:
    mongoRootUsername: "admin"
    mongoRootPassword: "INJECT_FROM_CI"
    mongoUserUri: "mongodb://mongo-user:27017/userdb"
    mongoCatalogUri: "mongodb://mongo-catalog:27017/catalogdb"
    mongoInventoryUri: "mongodb://mongo-inventory:27017/inventorydb"
    jwtSecret: "INJECT_FROM_CI"
    jwtExpiresIn: "1d"
mongodb:
  storage: 20Gi
  storageClass: nfs-client
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
